name: Update Match Day

on:
  schedule:
    - cron: "0 4 * * *"   # 07:00 Nairobi
  workflow_dispatch:
    inputs:
      date:
        description: "today, tomorrow, or a date like 2026-10-31"
        required: false
        default: "today"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the report
        env:
          DAY: ${{ inputs.date }}
        run: |
          python api_football_daily.py --date "${DAY:-today}" --outdir output
          mkdir site
          cp output/report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        
